<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 600" width="780" height="600">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 2L9 5L1 8" fill="none" stroke="#4a5568" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: Segoe UI, system-ui, sans-serif; }
      .title { font-size:13px; font-weight:700; fill:#1a202c; }
      .lbl   { font-size:11px; font-weight:600; fill:#2d3748; }
      .sub   { font-size:9px; fill:#718096; }
      .cat   { font-size:8px; font-weight:700; fill:#4a5568; letter-spacing:0.06em; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="780" height="600" fill="#f7f9fc" rx="12"/>
  <text x="390" y="28" text-anchor="middle" class="title">System Architecture</text>

  <!-- ── S1 Data Source  x=155 w=470 y=44 h=68 ── -->
  <!-- Right edge = 625 — all text fits within -->
  <rect x="155" y="44"  width="470" height="68" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1.2"/>
  <rect x="155" y="44"  width="6"   height="68" rx="3" fill="#805ad5"/>
  <text x="174" y="65"  class="lbl">ClinicalTrials.gov</text>
  <text x="174" y="81"  class="sub">JSON exports</text>
  <text x="174" y="95"  class="sub">Studies · Interventions · Conditions · Sponsors · Arm types · Locations</text>
  <line x1="390" y1="112" x2="390" y2="136" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── S2 Injection  x=200 w=380 y=136 h=52 ── -->
  <!-- Right edge = 580 — "Batch MERGE…" ~47 chars * 9 * 0.58 = 245px from x=174 → right≈419 OK -->
  <rect x="200" y="136" width="380" height="52" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1.2"/>
  <rect x="200" y="136" width="6"   height="52" rx="3" fill="#38b2ac"/>
  <text x="220" y="158" class="lbl">injection.py</text>
  <text x="220" y="176" class="sub">Batch MERGE into Neo4j · uniqueness constraints</text>
  <line x1="390" y1="188" x2="390" y2="212" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── S3 Neo4j  x=100 w=580 y=212 h=68 ── -->
  <!-- Right edge = 680 — both node/edge lines fit -->
  <rect x="100" y="212" width="580" height="68" rx="8" fill="#ebf8ff" stroke="#bee3f8" stroke-width="1.4"/>
  <rect x="100" y="212" width="6"   height="68" rx="3" fill="#3182ce"/>
  <text x="120" y="234" class="lbl" fill="#2b6cb0">Neo4j Knowledge Graph</text>
  <text x="120" y="250" class="sub">Nodes: Study · Intervention · Condition · Sponsor · Arm · Location</text>
  <text x="120" y="265" class="sub">Edges: SPONSORS · STUDIES · USES_INTERVENTION · HAS_ARM · CONDUCTED_AT</text>

  <!-- fork from Neo4j bottom=280 -->
  <line x1="390" y1="280" x2="390" y2="302" stroke="#4a5568" stroke-width="1.5"/>
  <line x1="160" y1="302" x2="620" y2="302" stroke="#4a5568" stroke-width="1.5"/>
  <line x1="160" y1="302" x2="160" y2="322" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="620" y1="302" x2="620" y2="322" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── S4a application.py  x=14 w=295 y=322 h=106 ── -->
  <!-- Right edge=309; longest text "No disk writes — Streamlit-compatible" ~38*9*0.58=199 from x=32 → 231 OK -->
  <rect x="14"  y="322" width="295" height="106" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1.2"/>
  <rect x="14"  y="322" width="6"   height="106" rx="3" fill="#ed8936"/>
  <text x="32"  y="342" class="lbl">application.py</text>
  <text x="32"  y="358" class="sub">Drug Intelligence · Disease Analytics</text>
  <text x="32"  y="372" class="sub">Sponsor Intelligence · Network Analytics</text>
  <text x="32"  y="386" class="sub">Geo &amp; Temporal · GraphRAG context</text>
  <text x="32"  y="400" class="sub">18 analytics functions</text>
  <text x="32"  y="414" class="sub">All return (fig, df)</text>

  <!-- ── S4b network_graph_supplementary.py  x=471 w=295 y=322 h=106 ── -->
  <!-- Right edge=766; longest "network_graph_supplementary.py" ~30*11*0.58=191 from x=489 → 680 OK -->
  <rect x="471" y="322" width="295" height="106" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1.2"/>
  <rect x="471" y="322" width="6"   height="106" rx="3" fill="#9f7aea"/>
  <text x="489" y="342" class="lbl">network_graph_supplementary.py</text>
  <text x="489" y="358" class="sub">Drug Condition ego-graph</text>
  <text x="489" y="372" class="sub">Sponsor collaboration network</text>
  <text x="489" y="386" class="sub">Condition similarity · Graph metrics</text>
  <text x="489" y="400" class="sub">Degree distribution · Bridge drugs</text>
  <text x="489" y="414" class="sub">6 functions · networkX based</text>

  <!-- merge to Streamlit -->
  <line x1="160" y1="428" x2="160" y2="452" stroke="#4a5568" stroke-width="1.5"/>
  <line x1="620" y1="428" x2="620" y2="452" stroke="#4a5568" stroke-width="1.5"/>
  <line x1="160" y1="452" x2="620" y2="452" stroke="#4a5568" stroke-width="1.5"/>
  <line x1="390" y1="452" x2="390" y2="468" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── S5 Streamlit  x=14 w=600 y=468 h=118 ── -->
  <!-- Right edge=614 -->
  <rect x="14"  y="468" width="600" height="118" rx="8" fill="#fff5f5" stroke="#fed7d7" stroke-width="1.4"/>
  <rect x="14"  y="468" width="6"   height="118" rx="3" fill="#e53e3e"/>
  <text x="34"  y="490" class="lbl" fill="#c53030">streamlit_app.py</text>

  <!-- Chat sub-box  x=34 w=258 y=500 h=74 right=292 -->
  <rect x="34"  y="500" width="258" height="74" rx="6" fill="#fff" stroke="#fed7d7" stroke-width="1"/>
  <text x="46"  y="516" class="cat" fill="#c53030">CHAT AGENT</text>
  <text x="46"  y="530" class="sub">LLM entity extraction</text>
  <text x="46"  y="543" class="sub">KG confirmation · Analysis selection</text>
  <text x="46"  y="556" class="sub">GraphRAG context · Streamed answer</text>
  <text x="46"  y="569" class="sub">Query Details expander per message</text>

  <!-- Analysis sub-box  x=304 w=258 y=500 h=74 right=562 -->
  <rect x="304" y="500" width="258" height="74" rx="6" fill="#fff" stroke="#fed7d7" stroke-width="1"/>
  <text x="316" y="516" class="cat" fill="#c53030">ANALYSIS AGENT</text>
  <text x="316" y="530" class="sub">Charts per turn</text>
  <text x="316" y="543" class="sub">LLM summary cached per panel</text>
  <text x="316" y="556" class="sub">Persistent across session turns</text>


  <!-- ── Ollama tag  x=624 w=142 y=468 h=118 ── -->
  <!-- Separate box outside streamlit, right edge=766 -->
  <rect x="624" y="468" width="142" height="118" rx="8" fill="#edf2ff" stroke="#c3d0ff" stroke-width="1.2"/>
  <rect x="636" y="480" width="20"  height="20"  rx="5" fill="#4f7cff"/>
  <text x="646" y="494" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">O</text>
  <text x="661" y="492" class="lbl" fill="#3c4fa0" font-size="10">Ollama</text>
  <text x="636" y="514" class="sub">Local LLM</text>
  <text x="636" y="527" class="sub">llama3</text>
  <text x="636" y="540" class="sub">gemma3</text>
  <text x="636" y="553" class="sub">phi4</text>
  <text x="636" y="566" class="sub">deepseek-r1</text>
</svg>