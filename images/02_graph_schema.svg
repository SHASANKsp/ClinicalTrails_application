<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 2L9 5L1 8" fill="none" stroke="#718096" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: Segoe UI, system-ui, sans-serif; }
      .title  { font-size:13px; font-weight:700; fill:#1a202c; }
      .node-t { font-size:12px; font-weight:700; }
      .node-p { font-size:9px; fill:#718096; }
      .rel    { font-size:9px; font-weight:700; }
      .legend { font-size:9.5px; fill:#718096; }
    </style>
  </defs>
  <rect width="800" height="480" fill="#f7f9fc" rx="12"/>
  <text x="400" y="26" text-anchor="middle" class="title">Knowledge Graph Schema</text>
  <!-- STUDY centre x=310 y=180 w=180 h=90 -->
  <rect x="310" y="180" width="180" height="90" rx="10" fill="#ebf8ff" stroke="#3182ce" stroke-width="2"/>
  <text x="400" y="202" text-anchor="middle" class="node-t" fill="#2b6cb0">Study</text>
  <text x="400" y="217" text-anchor="middle" class="node-p">nct_id · phases</text>
  <text x="400" y="229" text-anchor="middle" class="node-p">overall_status · enrollment</text>
  <text x="400" y="241" text-anchor="middle" class="node-p">allocation · masking · study_type</text>
  <text x="400" y="255" text-anchor="middle" class="node-p">start_date · completion_date</text>
  <!-- SPONSOR top-left x=40 y=50 w=170 h=64 -->
  <rect x="40"  y="50"  width="170" height="64" rx="10" fill="#faf5ff" stroke="#805ad5" stroke-width="1.5"/>
  <text x="125" y="74"  text-anchor="middle" class="node-t" fill="#553c9a">Sponsor</text>
  <text x="125" y="90"  text-anchor="middle" class="node-p">name</text>
  <text x="125" y="104" text-anchor="middle" class="node-p">class (Industry / Academic / Gov)</text>
  <!-- CONDITION top-right x=590 y=50 w=170 h=64 -->
  <rect x="590" y="50"  width="170" height="64" rx="10" fill="#f0fff4" stroke="#38a169" stroke-width="1.5"/>
  <text x="675" y="85"  text-anchor="middle" class="node-t" fill="#276749">Condition</text>
  <text x="675" y="100"  text-anchor="middle" class="node-p">name</text>
  <!-- INTERVENTION bottom-left x=40 y=350 w=170 h=50 -->
  <rect x="40"  y="350" width="170" height="50" rx="10" fill="#fffaf0" stroke="#dd6b20" stroke-width="1.5"/>
  <text x="125" y="371" text-anchor="middle" class="node-t" fill="#9c4221">Intervention</text>
  <text x="125" y="387" text-anchor="middle" class="node-p">name · type</text>
  <!-- LOCATION bottom-right x=590 y=350 w=170 h=50 -->
  <rect x="590" y="350" width="170" height="50" rx="10" fill="#fff5f5" stroke="#e53e3e" stroke-width="1.5"/>
  <text x="675" y="371" text-anchor="middle" class="node-t" fill="#c53030">Location</text>
  <text x="675" y="387" text-anchor="middle" class="node-p">country · city</text>
  <!-- ARM bottom-centre x=305 y=360 w=190 h=50 -->
  <rect x="305" y="360" width="190" height="50" rx="10" fill="#fffff0" stroke="#d69e2e" stroke-width="1.5"/>
  <text x="400" y="381" text-anchor="middle" class="node-t" fill="#975a16">Arm</text>
  <text x="400" y="397" text-anchor="middle" class="node-p">type: experimental / placebo / comparator</text>
  <!-- ARROWS — each has a white pill background so label never overlaps line -->
  <!-- SPONSORS: Sponsor(210,82) → Study(310,210) -->
  <line x1="210" y1="82"  x2="318" y2="195" stroke="#805ad5" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arr)"/>
  <rect x="208" y="116" width="76" height="16" rx="4" fill="#f7f9fc"/>
  <text x="246" y="128" text-anchor="middle" class="rel" fill="#805ad5">SPONSORS</text>
  <!-- STUDIES: Study(490,200) → Condition(590,82) -->
  <line x1="488" y1="198" x2="592" y2="112" stroke="#38a169" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arr)"/>
  <rect x="506" y="138" width="60" height="16" rx="4" fill="#f7f9fc"/>
  <text x="536" y="150" text-anchor="middle" class="rel" fill="#38a169">STUDIES</text>
  <!-- USES_INTERVENTION: Study(318,240) → Intervention(210,355) -->
  <line x1="318" y1="242" x2="212" y2="352" stroke="#dd6b20" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arr)"/>
  <rect x="212" y="278" width="120" height="16" rx="4" fill="#f7f9fc"/>
  <text x="272" y="290" text-anchor="middle" class="rel" fill="#dd6b20">USES_INTERVENTION</text>
  <!-- CONDUCTED_AT: Study(490,240) → Location(590,352) -->
  <line x1="488" y1="242" x2="592" y2="352" stroke="#e53e3e" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arr)"/>
  <rect x="494" y="282" width="96" height="16" rx="4" fill="#f7f9fc"/>
  <text x="542" y="294" text-anchor="middle" class="rel" fill="#e53e3e">CONDUCTED_AT</text>
  <!-- HAS_ARM: Study(400,270) → Arm(400,360) -->
  <line x1="400" y1="270" x2="400" y2="360" stroke="#d69e2e" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arr)"/>
  <rect x="358" y="296" width="84" height="16" rx="4" fill="#f7f9fc"/>
  <text x="400" y="308" text-anchor="middle" class="rel" fill="#d69e2e">HAS_ARM</text>
  <!-- LEGEND -->
  <rect x="40"  y="432" width="155" height="32" rx="6" fill="none" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="58"  y1="448" x2="96"  y2="448" stroke="#718096" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arr)"/>
  <text x="102" y="452" class="legend">Directed relationship</text>
</svg>