<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 980" width="780" height="980">
  <defs>
    <marker id="ar"   viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 2L9 5L1 8" fill="none" stroke="#4a5568" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ar-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 2L9 5L1 8" fill="none" stroke="#e53e3e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ar-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 2L9 5L1 8" fill="none" stroke="#38a169" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: Segoe UI, system-ui, sans-serif; }
      .title { font-size:13px; font-weight:700; fill:#1a202c; }
      .bh    { font-size:11px; font-weight:700; fill:#1a202c; }
      .bs    { font-size:9.5px; fill:#4a5568; }
      .num   { font-size:9px; font-weight:700; fill:#fff; }
      .note  { font-size:9px; fill:#718096; font-style:italic; }
      .step  { font-size:8.5px; font-weight:700; letter-spacing:0.06em; }
    </style>
  </defs>
  <rect width="780" height="980" fill="#f7f9fc" rx="12"/>
  <text x="390" y="26" text-anchor="middle" class="title">Query Pipeline</text>
  <!-- S1 y=44 h=38 -->
  <circle cx="28" cy="63"  r="11" fill="#4a5568"/>
  <text x="28"  y="67"  text-anchor="middle" class="num">1</text>
  <rect x="52"  y="44"  width="680" height="38" rx="8" fill="#edf2f7" stroke="#cbd5e0" stroke-width="1"/>
  <text x="72"  y="62"  class="bh">User question</text>
  <text x="72"  y="75"  class="bs">Natural language query</text>
  <line x1="390" y1="82"  x2="390" y2="104" stroke="#4a5568" stroke-width="1.5" marker-end="url(#ar)"/>
  <!-- S2 y=104 h=38 — NCT box narrower, NCT result box shifted right -->
  <circle cx="28" cy="123" r="11" fill="#d69e2e"/>
  <text x="28"  y="127" text-anchor="middle" class="num">2</text>
  <rect x="52"  y="104" width="420" height="38" rx="8" fill="#fffff0" stroke="#d69e2e" stroke-width="1.2"/>
  <text x="72"  y="122" class="bh">NCT ID guard</text>
  <text x="72"  y="135" class="bs">Regex \bNCT\d{8}\b, short circuits all downstream stages</text>
  <!-- NCT yes branch — clear gap before result box -->
  <line x1="472" y1="123" x2="492" y2="123" stroke="#d69e2e" stroke-width="1.5" marker-end="url(#ar-r)"/>
  <text x="478" y="116"  class="step" fill="#d69e2e">NCT</text>
  <rect x="494" y="104" width="238" height="38" rx="8" fill="#fffff0" stroke="#d69e2e" stroke-width="1"/>
  <text x="512" y="122" class="bh" fill="#975a16">nct_detail Cypher query</text>
  <text x="512" y="135" class="bs">Direct KG fetch · skips pipeline</text>
  <!-- no-NCT note left-aligned, below box -->
  <line x1="390" y1="142" x2="390" y2="162" stroke="#4a5568" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="254" y="155" class="note">no NCT ID — continue</text>
  <!-- S3 y=162 h=54 -->
  <circle cx="28" cy="189" r="11" fill="#805ad5"/>
  <text x="28"  y="193" text-anchor="middle" class="num">3</text>
  <rect x="52"  y="162" width="680" height="54" rx="8" fill="#faf5ff" stroke="#805ad5" stroke-width="1.2"/>
  <text x="72"  y="182" class="bh" fill="#553c9a">LLM based entity extraction</text>
  <text x="72"  y="197" class="bs">Ollama call · temperature=0 · num_predict=80 · 20 s timeout</text>
  <text x="72"  y="210" class="bs">Returns {entity_type, entity_value} or null · includes recent conversation history</text>
  <line x1="390" y1="216" x2="390" y2="238" stroke="#4a5568" stroke-width="1.5" marker-end="url(#ar)"/>
  <!-- S4 diamond y=238 — wider diamond so labels fit -->
  <circle cx="28" cy="268" r="11" fill="#4a5568"/>
  <text x="28"  y="272" text-anchor="middle" class="num">4</text>
  <polygon points="390,238 490,268 390,298 290,268" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.2"/>
  <text x="390" y="262" text-anchor="middle" class="bh" font-size="10">Entity</text>
  <text x="390" y="278" text-anchor="middle" class="bh" font-size="10">resolved?</text>
  <!-- null → hard stop — left of diamond (left point x=290) -->
  <line x1="290" y1="268" x2="190" y2="268" stroke="#e53e3e" stroke-width="1.5" marker-end="url(#ar-r)"/>
  <text x="238" y="260" class="step" fill="#e53e3e" text-anchor="middle">null</text>
  <rect x="52"  y="248" width="136" height="40" rx="8" fill="#fff5f5" stroke="#e53e3e" stroke-width="1.2"/>
  <text x="120" y="265" text-anchor="middle" class="bh" fill="#c53030">Hard stop</text>
  <text x="120" y="280" text-anchor="middle" class="bs" fill="#e53e3e">No defaults used</text>
  <!-- net/geo → right (right point x=490) -->
  <line x1="490" y1="268" x2="550" y2="268" stroke="#38a169" stroke-width="1.5" marker-end="url(#ar-g)"/>

  <rect x="552" y="248" width="180" height="40" rx="8" fill="#f0fff4" stroke="#38a169" stroke-width="1"/>
  <text x="642" y="265" text-anchor="middle" class="bs">Accepted directly</text>
  <text x="642" y="279" text-anchor="middle" class="bs">no KG confirmation needed</text>
  <!-- drug/disease/sponsor note — below diamond bottom y=298, gap before S5 -->
  <text x="390" y="318" text-anchor="middle" class="note">drug / disease / sponsor</text>
  <line x1="390" y1="298" x2="390" y2="334" stroke="#4a5568" stroke-width="1.5" marker-end="url(#ar)"/>
  <!-- S5 y=334 h=54 -->
  <circle cx="28" cy="361" r="11" fill="#3182ce"/>
  <text x="28"  y="365" text-anchor="middle" class="num">5</text>
  <rect x="52"  y="334" width="680" height="54" rx="8" fill="#ebf8ff" stroke="#3182ce" stroke-width="1.2"/>
  <text x="72"  y="354" class="bh" fill="#2b6cb0">KG confirmation</text>
  <text x="72"  y="369" class="bs">CONTAINS lookup in Neo4j · prefers exact match · picks shortest (most specific) name</text>
  <text x="72"  y="382" class="bs">Returns canonical_name + search_token · search_token catches all branches</text>
  <line x1="390" y1="388" x2="390" y2="408" stroke="#4a5568" stroke-width="1.5" marker-end="url(#ar)"/>
  <!-- S6 y=408 h=54 -->
  <circle cx="28" cy="435" r="11" fill="#718096"/>
  <text x="28"  y="439" text-anchor="middle" class="num">6</text>
  <rect x="52"  y="408" width="680" height="54" rx="8" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.2"/>
  <text x="72"  y="428" class="bh">Conversation context carryover</text>
  <text x="72"  y="443" class="bs">No new entity + prior context: inherit conv_context</text>
  <text x="72"  y="457" class="bs">Pronoun / reference detected: force prior entity · NCT queries do not update context</text>
  <line x1="390" y1="462" x2="390" y2="482" stroke="#4a5568" stroke-width="1.5" marker-end="url(#ar)"/>
  <!-- S7 y=482 h=54 -->
  <circle cx="28" cy="509" r="11" fill="#805ad5"/>
  <text x="28"  y="513" text-anchor="middle" class="num">7</text>
  <rect x="52"  y="482" width="680" height="54" rx="8" fill="#faf5ff" stroke="#805ad5" stroke-width="1.2"/>
  <text x="72"  y="502" class="bh" fill="#553c9a">LLM analysis selection</text>
  <text x="72"  y="517" class="bs">Ollama call · temperature=0 · closed menu per entity type · 18 analyses in catalogue</text>
  <text x="72"  y="530" class="bs">Hallucinated keys silently dropped · falls back to entity type defaults on failure</text>
  <line x1="390" y1="536" x2="390" y2="556" stroke="#4a5568" stroke-width="1.5" marker-end="url(#ar)"/>
  <!-- S8 y=556 h=54 -->
  <circle cx="28" cy="583" r="11" fill="#3182ce"/>
  <text x="28"  y="587" text-anchor="middle" class="num">8</text>
  <rect x="52"  y="556" width="680" height="54" rx="8" fill="#ebf8ff" stroke="#3182ce" stroke-width="1.2"/>
  <text x="72"  y="576" class="bh" fill="#2b6cb0">Cypher execution</text>
  <text x="72"  y="591" class="bs">Dispatches selected analysis keys · uses search_token for CONTAINS (catches all branches)</text>
  <text x="72"  y="604" class="bs">Returns (fig, df) per analysis · drug_paths always included for drug queries</text>
  <!-- fork -->
  <line x1="390" y1="610" x2="390" y2="636" stroke="#4a5568" stroke-width="1.5"/>
  <line x1="196" y1="636" x2="584" y2="636" stroke="#4a5568" stroke-width="1.5"/>
  <line x1="196" y1="636" x2="196" y2="656" stroke="#4a5568" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="584" y1="636" x2="584" y2="656" stroke="#4a5568" stroke-width="1.5" marker-end="url(#ar)"/>
  <!-- S9L y=656 h=80 x=52 w=290 -->
  <circle cx="28" cy="696" r="11" fill="#dd6b20"/>
  <text x="28"  y="700" text-anchor="middle" class="num">9</text>
  <rect x="52"  y="656" width="290" height="80" rx="8" fill="#fffaf0" stroke="#dd6b20" stroke-width="1.2"/>
  <text x="72"  y="676" class="bh" fill="#9c4221">GraphRAG context</text>
  <text x="72"  y="692" class="bs">build_graphrag_context()</text>
  <text x="72"  y="706" class="bs">Multi hop paths: Drug to Study</text>
  <text x="72"  y="720" class="bs">to Condition to Sponsor as text</text>
  <!-- S9R y=656 h=80 x=440 w=292 -->
  <rect x="440" y="656" width="292" height="80" rx="8" fill="#f0fff4" stroke="#38a169" stroke-width="1.2"/>
  <text x="460" y="676" class="bh" fill="#276749">Analysis agent</text>
  <text x="460" y="692" class="bs">Charts via matplotlib</text>
  <text x="460" y="706" class="bs">LLM summary cached per panel</text>
  <text x="460" y="720" class="bs">Persistent across turns</text>
  <!-- merge -->
  <line x1="196" y1="736" x2="196" y2="762" stroke="#4a5568" stroke-width="1.5"/>
  <line x1="584" y1="736" x2="584" y2="762" stroke="#4a5568" stroke-width="1.5"/>
  <line x1="196" y1="762" x2="584" y2="762" stroke="#4a5568" stroke-width="1.5"/>
  <line x1="390" y1="762" x2="390" y2="782" stroke="#4a5568" stroke-width="1.5" marker-end="url(#ar)"/>
  <!-- S10 y=782 h=70 -->
  <circle cx="28" cy="817" r="11" fill="#805ad5"/>
  <text x="28"  y="821" text-anchor="middle" class="num">10</text>
  <rect x="52"  y="782" width="680" height="70" rx="8" fill="#faf5ff" stroke="#805ad5" stroke-width="1.2"/>
  <text x="72"  y="803" class="bh" fill="#553c9a">Ollama LLM : answer generation</text>
  <text x="72"  y="818" class="bs">System prompt: entity context + KG evidence + aggregated data summary</text>
  <text x="72"  y="832" class="bs">Full conversation history passed each turn · streaming · no token limit</text>
  <text x="72"  y="846" class="bs">Answer grounded exclusively in KG retrieved evidence</text>
  <line x1="390" y1="852" x2="390" y2="872" stroke="#4a5568" stroke-width="1.5" marker-end="url(#ar)"/>
  <!-- S11 y=872 h=66 -->
  <circle cx="28" cy="905" r="11" fill="#e53e3e"/>
  <text x="28"  y="909" text-anchor="middle" class="num">11</text>
  <rect x="52"  y="872" width="680" height="66" rx="8" fill="#fff5f5" stroke="#e53e3e" stroke-width="1.2"/>
  <text x="72"  y="893" class="bh" fill="#c53030">Streamlit output</text>
  <text x="72"  y="908" class="bs">Chat panel: streamed answer + Query Details expander (Cypher, params, resolution method)</text>
  <text x="72"  y="922" class="bs">Analysis panel: charts per turn oldest-first · conv_context updated for next turn</text>
  <!-- feedback loop — stays inside right margin, label on left side of path -->
  <path d="M732 905 Q752 905 752 435 Q752 140 732 140" fill="none" stroke="#a0aec0" stroke-width="1.2" stroke-dasharray="6 3" marker-end="url(#ar)"/>
  <text x="746" y="550" text-anchor="middle" class="note" transform="rotate(90,746,550)">conv_context persists across turns</text>
</svg>